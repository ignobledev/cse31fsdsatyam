
    <!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Project</title>
    <style>
            .bulb-animation {
    animation: bulbEffect 0.5s ease;
}

@keyframes bulbEffect {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }

    100% {
        transform: scale(1);
    }
}
            </style>
</head>

<body>
    
    <img  id = "on" style="width:100px;height:100px; background-color:red;  " src="bulboff.webp"  />
    <img id = "off" style="width:100px; display:none; height:100px; " src="bulbon.webp"/>
                <button style="color:blue; font-size:16px; border-radius:4px"  onclick="handlechange()"> onclick</button>

    <h2>Welcome To fucntion</h2>
     <script>
    let  n = true;
function handlechange(){
         
      if(n){
n = false; 
         document.getElementById("on").style.display = "none";
            document.getElementById("off").style.display="block";
             document.getElementById("off").style.backgroundColor="yellow";
             document.getElementById("off").classList.add("bulb-animation");
             }

      else{
        document.getElementById("off").style.display="none";
            document.getElementById("on").style.display="block";
 document.getElementById("on").classList.add("bulb-animation");
      n = true;
      }
}
    </script>
</body>

</html>
